# ==============================================================================
# 000-MISSION-CONTROL: PRODUCTION DOCKER COMPOSE STACK
# Services:
#   1. app:  Multi-stage Nginx SPA container with hardened security
#   2. api:  Zero-dependency Node.js monitoring API (real CPU/RAM/Docker metrics)
#   3. caddy: Edge proxy with automatic Let's Encrypt / ZeroSSL certificate engine
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 000_app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - 000-net
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: 000_api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - API_PORT=4000
      - API_HOST=0.0.0.0
    volumes:
      # Read-only /proc and /sys for system metrics
      - /proc:/proc:ro
      - /sys:/sys:ro
      # Docker socket for container introspection
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 000-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2.8-alpine
    container_name: 000_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-000.localhost}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@000.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - 000-net

networks:
  000-net:
    driver: bridge

volumes:
  caddy_data:
    name: 000_caddy_data
  caddy_config:
    name: 000_caddy_config
